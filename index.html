<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10130f">
<meta name="description" content="A crafting-first visual field guide to S.T.A.L.K.E.R. GAMMA 0.9.5 artefacts and their modifiers.">
<title>GAMMA Artefact Field Guide</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar compact-topbar">
 <a class="brand" href="#"><span class="brand-mark">☢</span><span><b>THE ZONE ARCHIVE</b><small>GAMMA 0.9.5 / ARTEFACT FIELD GUIDE</small></span></a>
 <nav><a class="active" href="#catalog">PURPOSES</a></nav>
</header>
<main>
 <section class="catalog" id="catalog">
   <div class="toolbar"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="Search artefact, modifier, perk..." autocomplete="off"></label><label class="attribute-filter"><span>ATTRIBUTE</span><select id="attribute"><option value="">All attributes</option></select></label></div>
  <div class="filter-row"><button class="chip active" data-filter="all">ALL</button><button id="crafting-tree-button" class="crafting-tree-button" type="button">CRAFTING TREE <span aria-hidden="true">↗</span></button><span id="matrix-count" class="matrix-count"></span><span class="hint">SELECT AN ARTEFACT TO OPEN ITS FULL PROFILE</span></div>
  <div id="perk-matrix" class="progression-map" aria-live="polite"><div class="loading">LOADING ARTEFACTS...</div></div>
  <section class="compare" id="compare" hidden><div class="compare-head"><div><div class="section-kicker">FIELD ANALYSIS</div><h3>Artefact <em>comparison.</em></h3></div><button id="clear-compare" class="text-button">CLEAR SELECTION ×</button></div><div id="compare-content"></div></section>
 </section>

</main>
<footer><span>UNOFFICIAL COMMUNITY REFERENCE</span><span>DATA: <a href="https://github.com/simonwdev/stalker-anomaly-gamma-db" target="_blank" rel="noreferrer">STALKER GAMMA ITEM DATABASE</a></span></footer>
<dialog id="artifact-dialog"><button class="dialog-close" aria-label="Close details">×</button><div id="dialog-content"></div></dialog>
<dialog id="crafting-tree-dialog" class="crafting-tree-dialog"><button id="crafting-tree-close" class="dialog-close" aria-label="Close crafting tree">×</button><div id="crafting-tree-content"></div></dialog>
<script src="app.js"></script>
</body></html>
